# Wording for the MATE login theme: signing in is "email & password".
# Keys that are not listed here keep Keycloak's stock text. Messages go through
# MessageFormat, so a literal apostrophe is written ''.

# The tab title on every page - the same "MATE" the platform's own pages use,
# instead of the stock "Sign in to MATE".
loginTitle={0}

# Sign in
loginAccountTitle=Sign in with your email and password to continue.
doLogIn=Sign in
usernameOrEmail=Email
doForgotPassword=Forgot password?
identity-provider-login-label=Or continue with
invalidUserMessage=Invalid email or password.
missingUsernameMessage=Please enter your email.
missingPasswordMessage=Please enter your password.

# Forgot password
emailForgotTitle=Forgot your password?
emailInstruction=Enter your email address and we''ll send you instructions to reset your password.
invalidUsernameOrEmailMessage=Invalid email.
backToLogin=&larr; Back to sign in

# Errors
errorTitle=Something went wrong

# Theme toggle (the platform's own wording)
mateThemeToLight=Switch to light mode
mateThemeToDark=Switch to dark mode
