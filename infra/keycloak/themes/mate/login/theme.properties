# MATE login theme: the Keycloak-hosted pages (email & password sign-in, forgot
# password, update password, ...) rendered in the platform's own look.
# See ../../README.md.
parent=base

# Only the layout (template.ftl) is overridden. Every other page - including the
# ones this theme never touches (OTP, WebAuthn, verify email, update profile, ...)
# - is Keycloak's stock template, and picks up the look because the kc* keys
# below point its markup at the classes in css/mate.css.
styles=css/mate.css
# A blocking script in <head>: applies the saved light/dark choice before first
# paint, so the page never flashes the wrong theme.
scripts=js/theme-init.js

# `name==content` pairs, space-separated (so no spaces inside a value).
meta=viewport==width=device-width,initial-scale=1

## Form
kcFormClass=mate-form
kcFormGroupClass=mate-field
kcFormGroupHeader=mate-field
kcLabelClass=mate-label
kcLabelWrapperClass=mate-label-wrap
kcInputClass=mate-input
kcInputWrapperClass=mate-input-wrap
kcInputGroup=mate-input-group
kcInputHelperTextBeforeClass=mate-help
kcInputHelperTextAfterClass=mate-help
kcInputErrorMessageClass=mate-field-error
kcTextareaClass=mate-input mate-textarea
kcFormOptionsClass=mate-form-options
kcFormOptionsWrapperClass=mate-form-options-item
kcFormButtonsClass=mate-form-buttons
kcFormButtonsWrapperClass=mate-form-buttons
kcFormSettingClass=mate-form-settings
kcSrOnlyClass=mate-sr-only

## Check boxes and radios
kcInputClassCheckbox=mate-check
kcInputClassCheckboxLabel=mate-check-label
kcInputClassRadio=mate-check
kcInputClassRadioLabel=mate-check-label
kcInputClassRadioCheckboxLabelDisabled=mate-disabled
kcCheckClass=mate-check
kcCheckLabelClass=mate-check-label

## Buttons. The primary one is the platform's default button; every other button
## is its outline variant, so a button that names no priority still looks right.
kcButtonClass=mate-btn
kcButtonPrimaryClass=mate-btn-primary
kcButtonLargeClass=mate-btn-lg
kcButtonBlockClass=mate-btn-block

## Alert (rendered by template.ftl)
kcAlertClass=mate-alert

## Identity providers ("Or continue with ...")
kcFormSocialAccountSectionClass=mate-social
kcFormSocialAccountListClass=mate-social-list
kcFormSocialAccountListButtonClass=mate-btn mate-btn-lg mate-btn-block
kcCommonLogoIdP=mate-social-logo
# Brand marks: Keycloak looks the class up as kcLogoIdP-<alias> (then -<provider type>),
# and css/mate.css draws it. The aliases are the ones configure-social-idps.sh creates.
kcLogoIdP-google=mate-idp-google
kcLogoIdP-microsoft=mate-idp-microsoft
kcLogoIdP-github=mate-idp-github

## Password visibility toggle (the stock passwordVisibility.js swaps these classes)
kcFormPasswordVisibilityButtonClass=mate-icon-btn
kcFormPasswordVisibilityIconShow=mate-icon mate-icon-eye
kcFormPasswordVisibilityIconHide=mate-icon mate-icon-eye-off

## "Restart login" next to the attempted username
kcResetFlowIcon=mate-icon mate-icon-undo

## Locale picker (only rendered when the realm enables internationalization)
kcLocaleMainClass=mate-locale
kcLocaleListClass=mate-locale-list
kcLocaleItemClass=mate-locale-item

## Select authenticator ("Try another way")
kcSelectAuthListClass=mate-select-list
kcSelectAuthListItemClass=mate-select-item
kcSelectAuthListItemIconClass=mate-select-icon
kcSelectAuthListItemBodyClass=mate-select-body
kcSelectAuthListItemHeadingClass=mate-select-heading
kcSelectAuthListItemDescriptionClass=mate-select-desc
kcSelectAuthListItemFillClass=mate-select-fill
kcSelectAuthListItemArrowClass=mate-select-arrow
kcSelectAuthListItemArrowIconClass=mate-icon mate-icon-chevron-right
kcAuthenticatorDefaultClass=mate-icon mate-icon-key
kcAuthenticatorPasswordClass=mate-icon mate-icon-lock
kcAuthenticatorOTPClass=mate-icon mate-icon-smartphone
kcAuthenticatorWebAuthnClass=mate-icon mate-icon-key
kcAuthenticatorWebAuthnPasswordlessClass=mate-icon mate-icon-key

## OTP credential picker: a visually hidden radio, its label as the selectable tile
kcLoginOTPListInputClass=mate-tile-input
kcLoginOTPListClass=mate-tile
kcLoginOTPListItemHeaderClass=mate-tile-header
kcLoginOTPListItemIconClass=mate-icon mate-icon-smartphone
kcLoginOTPListItemTitleClass=mate-tile-title

## WebAuthn
kcWebAuthnKeyIcon=mate-icon mate-icon-key
kcWebAuthnDefaultIcon=mate-icon mate-icon-key

## Recovery codes
kcRecoveryCodesWarning=mate-alert alert-warning
kcRecoveryCodesList=mate-recovery-list
kcRecoveryCodesActions=mate-recovery-actions
