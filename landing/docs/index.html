<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MATE — Documentation</title>
<!-- Entry stub for the /docs/ URL. In-site links skip it and point straight at
     site/introduction.html, so this only runs for typed/bookmarked /docs/ URLs.
     The redirect happens in <head>, before the first paint, so it never flashes
     a blank page; the meta refresh is the no-JS fallback. -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('pmmate-theme');
      if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
    location.replace('site/introduction.html');
  })();
</script>
<meta http-equiv="refresh" content="0; url=site/introduction.html">
<link rel="canonical" href="https://mate.uni-muenster.de/docs/site/introduction.html">
<link rel="icon" href="../assets/mate-icon-black.svg" type="image/svg+xml">
<style>
  :root { --bg: #fdfdfd; --ink: #17181c; --ink-soft: #494c57; }
  [data-theme="dark"] { --bg: #0e0e12; --ink: #f0f0f4; --ink-soft: #b4b6c1; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; font-size: 16.5px;
    color: var(--ink-soft); background: var(--bg);
  }
  a { color: var(--ink); text-underline-offset: 3px; }
</style>
</head>
<body>
<p>Redirecting to <a href="site/introduction.html">the MATE documentation</a>.</p>
</body>
</html>
